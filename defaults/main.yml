---

pacemaker_corosync_fqdn: false
pacemaker_corosync_group: false
pacemaker_remote_group: false
pacemaker_corosync_ring_interface: false
pacemaker_remote_ring_interface: "{{ pacemaker_corosync_ring_interface }}"
pacemaker_remote_register_resource: true
pacemaker_corosync_use_syslog: true
pacemaker_corosync_use_logfile: false
pacemaker_corosync_bootstrap_node: "{{ groups[pacemaker_corosync_group] | first }}"

# Centos EPEL repository options (for haveged)
pacemaker_corosync_haveged_enabled: true
pacemaker_corosync_centos_epel_mirror: "{{ centos_epel_mirror | default('http://dl.fedoraproject.org/pub/epel') }}"
pacemaker_corosync_centos_epel_key: >-
  {{ centos_epel_key | default('http://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-' ~ ansible_facts['distribution_major_version']) }}
