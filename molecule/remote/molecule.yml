---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

prerun: false

platforms:
  - name: pacemaker-cluster01
    groups:
      - corosync
    <<: &host_config
      image: "${docker_user:-quay.io/gotmax23}/${docker_image_tag:-ubuntu-systemd:noble}"
      command: ""
      pre_build_image: true
      privileged: true
      shm_size: 512m
  - name: pacemaker-cluster02
    <<: *host_config
    groups:
      - corosync
  - name: pacemaker-cluster03
    <<: *host_config
    groups:
      - corosync
  - name: pacemaker-remote01
    <<: *host_config
    groups:
      - pacemaker_remote

provisioner:
  name: ansible
  options:
    v: true
  log: true
  lint:
    name: ansible-lint
  playbooks:
    cleanup: ../../tests/cleanup.yml
    prepare: ../../tests/prepare.yml
    converge: ../../tests/test_remote.yml
    side_effect: ../../tests/side_effect_remote.yml
    verify: ../../tests/verify.yml
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: remote
