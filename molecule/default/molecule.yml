---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: default-pacemaker01
    <<: &host_config
      image: "${docker_user:-quay.io/gotmax23}/${docker_image_tag:-ubuntu-systemd:noble}"
      command: ""
      pre_build_image: true
      groups:
        - corosync
      privileged: true
      shm_size: 512m
  - name: default-pacemaker02
    <<: *host_config
  - name: default-pacemaker03
    <<: *host_config

provisioner:
  name: ansible
  options:
    v: true
  log: true
  lint:
    name: ansible-lint
  playbooks:
    cleanup: ../../tests/cleanup.yml
    prepare: ../../tests/prepare.yml
    converge: ../../tests/test.yml
    side_effect: ../../tests/side_effect_default.yml
    verify: ../../tests/verify.yml
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: default
