---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: pacemaker
    image: "${docker_user:-quay.io/gotmax23}/${docker_image_tag:-ubuntu-systemd:noble}"
    command: ""
    pre_build_image: true
    groups:
      - corosync
    privileged: true

provisioner:
  name: ansible
  options:
    v: True
  log: True
  lint:
    name: ansible-lint
  playbooks:
    converge: ../../tests/test.yml
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: default
