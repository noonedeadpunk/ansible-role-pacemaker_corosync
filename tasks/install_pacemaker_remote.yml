---
- name: Creates pacemaker directory
  ansible.builtin.file:
    path: /etc/pacemaker
    state: directory
    mode: "0750"
    owner: root
    group: haclient

- name: Generates pacemaker authkey
  ansible.builtin.copy:
    content: "{{ lookup('pipe', 'head -c 4096 /dev/urandom | base64') | b64decode }}"
    dest: /etc/pacemaker/authkey
    force: false
    mode: "0640"
    owner: root
    group: haclient
  when:
    - inventory_hostname == pacemaker_corosync_bootstrap_node
  notify:
    - Restart pacemaker
    - Restart pacemaker-remote

- name: Distribute pacemaker authkey
  when:
    - inventory_hostname != pacemaker_corosync_bootstrap_node
  block:
    - name: Fetch pacemaker authkey for other nodes
      ansible.builtin.slurp:
        src: /etc/pacemaker/authkey
      delegate_to: "{{ pacemaker_corosync_bootstrap_node }}"
      check_mode: false
      register: _pacemaker_authkey

    - name: Copy pacemaker authkey to other nodes
      ansible.builtin.copy:
        content: "{{ _pacemaker_authkey['content'] | b64decode }}"
        dest: /etc/pacemaker/authkey
        mode: "0640"
        owner: root
        group: haclient
      notify:
        - Restart pacemaker
        - Restart pacemaker-remote
