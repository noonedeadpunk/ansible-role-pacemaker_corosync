---
- name: Verify corosync and pacemaker cluster state
  hosts: all
  pre_tasks:
    - name: Load scenario variables
      ansible.builtin.include_vars:
        file: "vars_{{ molecule_yml.scenario.name | default(lookup('env', 'MOLECULE_SCENARIO_NAME') | default('default')) }}.yml"

    - name: Set pacemaker remote group existence fact
      ansible.builtin.set_fact:
        _pacemaker_remote_group_exists: "{{ (pacemaker_remote_group is defined and pacemaker_remote_group and pacemaker_remote_group in groups) | bool }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

  tasks:
    - name: Verify cluster node services and status
      when:
        - pacemaker_corosync_group in groups
        - inventory_hostname in groups[pacemaker_corosync_group]
      block:
        - name: Assert corosync/pacemaker service is running
          ansible.builtin.assert:
            that:
              - ansible_facts.services['corosync.service'] is defined
              - ansible_facts.services['corosync.service'].state == 'running'
              - ansible_facts.services['pacemaker.service'] is defined
              - ansible_facts.services['pacemaker.service'].state == 'running'

        - name: Check corosync quorum status
          ansible.builtin.command: corosync-quorumtool -s
          register: _corosync_quorumtool
          changed_when: false

        - name: Verify corosync cluster is quorate
          ansible.builtin.assert:
            that:
              - _corosync_quorumtool.rc == 0
              - "'Quorate:          Yes' in _corosync_quorumtool.stdout or 'Flags:            Quorate' in _corosync_quorumtool.stdout"
            fail_msg: "Cluster is not quorate: {{ _corosync_quorumtool.stdout }}"

        - name: Check corosync ring status
          ansible.builtin.command: corosync-cfgtool -s
          register: _corosync_cfgtool
          changed_when: false

        - name: Verify corosync ring has no faults
          ansible.builtin.assert:
            that:
              - _corosync_cfgtool.rc == 0
              - "'fault' not in _corosync_cfgtool.stdout | lower"
            fail_msg: "Corosync ring has faults: {{ _corosync_cfgtool.stdout }}"

        - name: Wait for Pacemaker cluster to become quorate and DC elected
          ansible.builtin.command: crm_mon -1
          register: _crm_mon_status
          until:
            - _crm_mon_status.rc == 0
            - "'Current DC:' in _crm_mon_status.stdout"
            - "'Current DC: NONE' not in _crm_mon_status.stdout"
            - "'UNCLEAN' not in _crm_mon_status.stdout"
          retries: 12
          delay: 5
          changed_when: false

        - name: Verify all corosync cluster nodes are online in Pacemaker
          ansible.builtin.assert:
            that:
              - "item in _crm_mon_status.stdout"
            fail_msg: "Node {{ item }} is not online according to crm_mon: {{ _crm_mon_status.stdout }}"
          loop: "{{ groups[pacemaker_corosync_group] }}"

        - name: Verify remote node port 3121 is reachable from cluster nodes over remote ring interface
          ansible.builtin.wait_for:
            host: >-
              {{ hostvars[item]['ansible_facts'][hostvars[item]['pacemaker_remote_ring_interface'] |
                 replace('-', '_')]['ipv4']['address'] }}
            port: 3121
            timeout: 15
          loop: "{{ groups.get(pacemaker_remote_group, []) }}"
          when:
            - _pacemaker_remote_group_exists | bool

        - name: Wait for remote nodes to report online in Pacemaker
          ansible.builtin.command: crm_mon -1
          register: _crm_mon_remote_status
          until:
            - _crm_mon_remote_status.rc == 0
            - "'RemoteOnline:' in _crm_mon_remote_status.stdout or 'Remote Nodes:' in _crm_mon_remote_status.stdout"
            - "item in _crm_mon_remote_status.stdout"
            - "'UNCLEAN' not in _crm_mon_remote_status.stdout"
            - "'RemoteOFFLINE' not in _crm_mon_remote_status.stdout"
          retries: 15
          delay: 5
          changed_when: false
          loop: "{{ groups.get(pacemaker_remote_group, []) }}"
          when:
            - _pacemaker_remote_group_exists | bool
            - inventory_hostname == groups[pacemaker_corosync_group][0]
            - pacemaker_remote_register_resource | default(true) | bool

    - name: Verify pacemaker-remote node services and status
      when:
        - _pacemaker_remote_group_exists | bool
        - inventory_hostname in groups.get(pacemaker_remote_group, [])
      block:
        - name: Assert corosync service is not running on remote node
          ansible.builtin.assert:
            that:
              - ansible_facts.services['corosync.service'] is not defined or ansible_facts.services['corosync.service'].state != 'running'
            fail_msg: "Corosync service should not be running on remote node {{ inventory_hostname }}"

        - name: Assert pacemaker service is not running on remote node
          ansible.builtin.assert:
            that:
              - ansible_facts.services['pacemaker.service'] is not defined or ansible_facts.services['pacemaker.service'].state != 'running'
            fail_msg: "Pacemaker service should not be running on remote node {{ inventory_hostname }}"

        - name: Verify legacy corosync configuration is absent on remote node
          ansible.builtin.stat:
            path: /etc/corosync/corosync.conf
          register: _legacy_corosync_conf

        - name: Assert legacy corosync.conf does not exist on remote node
          ansible.builtin.assert:
            that:
              - not _legacy_corosync_conf.stat.exists
            fail_msg: "Legacy corosync.conf should not exist on remote node {{ inventory_hostname }}"

        - name: Assert pacemaker-remote service is running
          ansible.builtin.assert:
            that:
              - ansible_facts.services['pacemaker_remote.service'] is defined
              - ansible_facts.services['pacemaker_remote.service'].state == 'running'
            fail_msg: "Pacemaker remote service is not running on {{ inventory_hostname }}"

        - name: Verify pacemaker_remote port is listening on remote ring interface
          ansible.builtin.wait_for:
            port: 3121
            host: "{{ ansible_facts[pacemaker_remote_ring_interface | replace('-', '_')]['ipv4']['address'] }}"
            timeout: 15

    - name: Verify pacemaker authkey permissions across all nodes
      when: _pacemaker_remote_group_exists | bool
      block:
        - name: Stat pacemaker authkey
          ansible.builtin.stat:
            path: /etc/pacemaker/authkey
          register: _pacemaker_authkey_stat
        - name: Assert pacemaker authkey exists with correct permissions
          ansible.builtin.assert:
            that:
              - _pacemaker_authkey_stat.stat.exists
              - _pacemaker_authkey_stat.stat.mode == '0640'
            fail_msg: "/etc/pacemaker/authkey is missing or has incorrect permissions on {{ inventory_hostname }}"
