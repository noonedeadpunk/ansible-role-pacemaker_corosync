name: Molecule

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        scenario:
          - tag: centos-systemd:stream10
            user: quay.io/gotmax23
          - tag: debian-systemd:13
            user: quay.io/gotmax23
          - tag: ubuntu-systemd:24.04
            user: quay.io/gotmax23
          - tag: ubuntu-systemd:26.04
            user: quay.io/gotmax23
        python-version:
          - "3.12"
        ansible-version:
          - 2.18.19
          - 2.21.5

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: "${{ github.repository }}"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r ${{ github.repository }}/tests/requirements.txt
      - name: Install ansible
        run: |
          python3 -m pip install ansible-core==${{ matrix.ansible-version }}
      - name: Test with molecule
        run: |
          cd ${{ github.repository }}
          export docker_image_tag="${{ matrix.scenario.tag }}"
          export docker_user="${{ matrix.scenario.user }}"
          ansible-lint tests/test.yml
          molecule test
