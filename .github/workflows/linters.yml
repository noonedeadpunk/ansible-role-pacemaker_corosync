name: linters

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: "${{ github.repository }}"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: ${{ github.repository }}/tests/requirements.txt
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r ${{ github.repository }}/tests/requirements.txt
      - name: Test with ansible-lint
        run: |
          cd ${{ github.repository }}
          ansible-lint tests/test.yml tests/test_remote.yml tests/side_effect_remote.yml tests/verify.yml tests/side_effect_default.yml
