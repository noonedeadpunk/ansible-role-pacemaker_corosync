---
_pacemaker_cli_package_name:
  redhat: pacemaker-cli
  debian: pacemaker-cli-utils
_pacemaker_remote_group_exists: "{{ (pacemaker_remote_group is defined and pacemaker_remote_group in groups) }}"
_pacemaker_corosync_install_packages: |-
  {% set _packages = [_pacemaker_cli_package_name[ansible_facts['os_family'] | lower]] %}
  {% if pacemaker_corosync_group in groups and inventory_hostname in groups[pacemaker_corosync_group] %}
  {%   set _ = _packages.extend(['corosync', 'pacemaker', 'pcs']) %}
  {% endif %}
  {% if _pacemaker_remote_group_exists and inventory_hostname in groups[pacemaker_remote_group] %}
  {%   set _ = _packages.append('pacemaker-remote') %}
  {% endif %}
  {{ _packages }}

_centos_ha_repo_name:
  '8': ha
  '9': highavailability
  '10': highavailability
